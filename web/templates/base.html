<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Terra-GEN{% endblock %}</title>
<style>
:root{--bg:#F6F7F9;--card:#fff;--ink:#14181F;--muted:#4A5260;--line:#E3E6EB;--field:#C5CAD3;--accent:#0E6B5C;--accent-ink:#fff;--soft:#E6F2EF;--warn:#FFF6E0;--warnline:#E8C873;--warnink:#4A3A00;--err:#FDECEC;--errline:#E5A3A3;--errink:#7A1F1F}
@media (prefers-color-scheme: dark){:root{--bg:#12161B;--card:#1A2027;--ink:#E8ECF1;--muted:#A5AEBB;--line:#2B333D;--field:#3A4452;--accent:#3FB6A0;--accent-ink:#0B1512;--soft:#16302B;--warn:#3A3212;--warnline:#7A6A24;--warnink:#FFE9A3;--err:#3A1A1A;--errline:#7A3A3A;--errink:#FFC9C9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:20px;color:var(--ink);text-decoration:none}
.tag{font-size:14px;color:var(--muted)}
main{max-width:1000px;margin:0 auto;padding:32px 20px 64px}
h1{margin:0 0 8px;font-size:32px;line-height:1.15;letter-spacing:-0.02em}
h2{margin:0 0 12px;font-size:18px}
.sub{margin:0 0 24px;color:var(--muted);max-width:680px}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;padding:0;list-style:none;font-size:14px}
.steps li{padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps li[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}
label{display:block;margin:0 0 6px;font-size:14px;font-weight:600}
input[type=text],textarea{width:100%;border:1px solid var(--field);border-radius:8px;background:var(--card);color:var(--ink);font:15px system-ui,sans-serif;padding:10px 12px}
input[type=text]{height:44px;margin-bottom:16px}
textarea{resize:vertical}
textarea.mono{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.btn{min-height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 16px system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--field)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.alert{border-radius:10px;padding:12px 16px;margin-bottom:16px;background:var(--err);border:1px solid var(--errline);color:var(--errink)}
.note{border-radius:10px;padding:12px 16px;margin-top:12px;background:var(--warn);border:1px solid var(--warnline);color:var(--warnink)}
ul.list{margin:0;padding-left:22px}
ul.list li{margin:4px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.diagram{background:#fff;border-radius:10px;padding:12px;border:1px solid var(--line)}
.diagram svg{display:block;width:100%;height:auto}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<header>
<a class="brand" href="{{ url_for('index') }}">Terra-GEN</a>
<span class="tag">AWS · Terraform · no API key needed</span>
</header>
<main>
<ol class="steps" aria-label="Progress">
<li{% if step == 1 %} aria-current="step"{% endif %}>1. Requirement</li>
<li{% if step == 2 %} aria-current="step"{% endif %}>2. Review</li>
<li{% if step == 3 %} aria-current="step"{% endif %}>3. Download</li>
</ol>
{% block content %}{% endblock %}
</main>
</body>
</html>
